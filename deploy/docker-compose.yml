# Whole system:      docker compose -f deploy/docker-compose.yml up --build
# Settings:          copy deploy/.env.example to deploy/.env (all values have demo defaults)
# Infrastructure only (run services from the IDE):
#                    docker compose -f deploy/docker-compose.yml up kafka postgres mongo
name: dws-trade-app

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile.service
  restart: on-failure

x-env: &env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  # Empty = the server's own time zone. Set e.g. Europe/London to override.
  TRADE_BUSINESS_ZONE: ${TRADE_BUSINESS_ZONE:-}
  # HTTP Basic account for the demo. Change both for anything other than a demo.
  TRADE_SECURITY_USERNAME: ${TRADE_SECURITY_USERNAME:-admin}
  TRADE_SECURITY_PASSWORD: ${TRADE_SECURITY_PASSWORD:-admin@2026!}
  TZ: ${TZ:-}

services:
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: tradestore
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      # The query service connects as a read-only account created by the init script.
      TRADE_RO_PASSWORD: ${TRADE_RO_PASSWORD:-trade_ro}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d tradestore"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  trade-capture-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-capture-service } }
    ports: ["8081:8081"]
    environment: *env
    depends_on: { kafka: { condition: service_healthy } }

  trade-processor-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-processor-service } }
    ports: ["8082:8082"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradestore
      SPRING_DATASOURCE_USERNAME: trade
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-trade}
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  trade-query-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-query-service } }
    ports: ["8083:8083"]
    environment:
      <<: *env
      # Read-only database account: the query service cannot change a trade.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradestore
      SPRING_DATASOURCE_USERNAME: trade_ro
      SPRING_DATASOURCE_PASSWORD: ${TRADE_RO_PASSWORD:-trade_ro}
      SPRING_MONGODB_URI: mongodb://mongo:27017/tradestore
    depends_on:
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
      trade-processor-service: { condition: service_started }

  trade-simulator:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-simulator } }
    ports: ["8084:8084"]
    environment:
      <<: *env
      SIMULATOR_CAPTURE_URL: http://trade-capture-service:8081
    depends_on: [trade-capture-service]

  trade-dashboard-ui:
    build: { context: ../trade-dashboard-ui }
    ports: ["8080:8080"]
    environment:
      TRADE_SECURITY_USERNAME: ${TRADE_SECURITY_USERNAME:-admin}
      TRADE_SECURITY_PASSWORD: ${TRADE_SECURITY_PASSWORD:-admin@2026!}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      retries: 20
    depends_on: [trade-query-service, trade-simulator]
