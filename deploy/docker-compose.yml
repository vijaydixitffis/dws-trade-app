# Whole system:      docker compose -f deploy/docker-compose.yml up --build
# Infrastructure only (run services from the IDE):
#                    docker compose -f deploy/docker-compose.yml up kafka postgres mongo
name: dws-trade-app

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile.service
  restart: on-failure

x-env: &env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  # Empty = the server's own time zone. Set e.g. Europe/London to override.
  TRADE_BUSINESS_ZONE: ${TRADE_BUSINESS_ZONE:-}
  TZ: ${TZ:-}

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: tradestore
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d tradestore"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.2
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  trade-capture-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-capture-service } }
    ports: ["8081:8081"]
    environment: *env
    depends_on: { kafka: { condition: service_healthy } }

  trade-processor-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-processor-service } }
    ports: ["8082:8082"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradestore
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  trade-query-service:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-query-service } }
    ports: ["8083:8083"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradestore
      SPRING_MONGODB_URI: mongodb://mongo:27017/tradestore
    depends_on:
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
      trade-processor-service: { condition: service_started }

  trade-simulator:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.service, args: { MODULE: trade-simulator } }
    ports: ["8084:8084"]
    environment:
      <<: *env
      SIMULATOR_CAPTURE_URL: http://trade-capture-service:8081
    depends_on: [trade-capture-service]

  trade-dashboard-ui:
    build: { context: ../trade-dashboard-ui }
    ports: ["8080:80"]
    depends_on: [trade-query-service, trade-simulator]
