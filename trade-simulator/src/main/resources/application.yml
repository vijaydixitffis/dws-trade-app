server:
  port: 8084

spring:
  application:
    name: trade-simulator
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    # Percentages left out of a run request mean zero (Jackson 3 refuses missing primitives by default).
    deserialization:
      fail-on-null-for-primitives: false

simulator:
  capture-url: http://localhost:8081

trade:
  # Time zone that defines "today" for generated maturity dates. Empty = the server's own zone.
  business-zone: ""
  security:
    # Demo account for HTTP Basic authentication; also used to call the capture API.
    username: admin
    password: "admin@2026!"

management:
  endpoints:
    web:
      exposure:
        include: health,info
