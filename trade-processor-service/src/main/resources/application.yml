server:
  port: 8082

spring:
  application:
    name: trade-processor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tradestore
    username: trade
    password: trade
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trade-processor
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

trade:
  # Time zone that defines "today". Empty = the server's own zone. Example: Europe/London
  business-zone: ""
  security:
    # Demo account for HTTP Basic authentication. Override with TRADE_SECURITY_USERNAME / _PASSWORD.
    username: admin
    password: "admin@2026!"
  inbound-partitions: 6
  processor:
    # Consumer threads per instance; at most one is useful per partition.
    concurrency: 3
  expiry:
    # Seconds minutes hours day month weekday, in the business zone. "-" disables the schedule.
    cron: "0 1 0 * * *"
    batch-size: 500
    # Also run once at start-up, in the background, to catch trades that matured while down.
    run-on-startup: true
    lock-at-least: PT5S
  outbox:
    # Events are saved with the change they describe and published by a relay; how often it
    # looks for waiting events and how many it sends at once.
    interval-ms: 200
    batch-size: 500
  retry:
    # Failures other than unreadable records and constraint violations are retried with
    # exponential back-off, so a short database or broker outage only delays trades.
    initial-interval-ms: 500
    max-interval-ms: 30000
    # After this long without success the record is parked on the dead-letter topic.
    max-elapsed-ms: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
