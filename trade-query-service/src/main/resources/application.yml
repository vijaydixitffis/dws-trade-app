server:
  port: 8083

spring:
  application:
    name: trade-query-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tradestore
    username: trade
    password: trade
  mongodb:
    uri: mongodb://localhost:27017/tradestore
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trade-query
      auto-offset-reset: earliest

trade:
  # Time zone that defines "today". Empty = the server's own zone. Example: Europe/London
  business-zone: ""
  retry:
    initial-interval-ms: 500
    max-interval-ms: 30000
    max-elapsed-ms: 600000
  security:
    # Demo account for HTTP Basic authentication. Override with TRADE_SECURITY_USERNAME / _PASSWORD.
    username: admin
    password: "admin@2026!"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
