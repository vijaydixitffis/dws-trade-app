# Dashboard host for the demo. Everything is behind HTTP Basic authentication, and the same
# credentials are forwarded to the services. There is no API gateway in the demo scope: this
# server only serves the page and forwards the page's own API calls (see the HLD, known issues).

# Per-client request limit for the API paths.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 2m;

    auth_basic "Trade Store";
    auth_basic_user_file /tmp/.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The page loads only its own scripts and styles and talks only to its own origin.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Container health check; no credentials.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Query API, including the Server-Sent Events stream (no buffering, long read timeout).
    location /query/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://trade-query-service:8083/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /simulator/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://trade-simulator:8084/;
    }
}
