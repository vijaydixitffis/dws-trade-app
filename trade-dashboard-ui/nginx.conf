# Dashboard and API gateway for the demo.
# Everything is behind HTTP Basic authentication; the same credentials are forwarded to the services.
server {
    listen 80;
    server_tokens off;

    auth_basic "Trade Store";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Container health check; no credentials.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Query API, including the Server-Sent Events stream (no buffering, long read timeout).
    location /query/ {
        proxy_pass http://trade-query-service:8083/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /simulator/ {
        proxy_pass http://trade-simulator:8084/;
    }
}
