name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a moving tag; Dependabot proposes updates.
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  # Unit, slice and integration tests (Testcontainers: Kafka, PostgreSQL, MongoDB) with the JaCoCo coverage gate.
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  frontend:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-dashboard-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trade-dashboard-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Open-source vulnerability scan. The build fails on any CRITICAL finding (CVSS 9.0 or above).
  vulnerability-scan:
    name: OSS vulnerability scan
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Resolve dependencies so the scanners see exactly what the build uses.
      - run: mvn -B -ntp -DskipTests -Djacoco.skip=true install
      - name: Trivy scan of Maven and npm dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: npm audit (dashboard)
        working-directory: trade-dashboard-ui
        run: npm ci && npm audit --audit-level=critical
      # OWASP Dependency-Check needs an NVD API key to download its data in reasonable time.
      # It runs when the repository secret NVD_API_KEY is set.
      - name: OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: mvn -B -ntp -Psecurity-scan -DskipTests -Djacoco.skip=true verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.NVD_API_KEY != ''
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
      - name: Software bill of materials (CycloneDX)
        run: docker run --rm -v "$PWD":/src "$TRIVY_IMAGE" fs --format cyclonedx --output /src/sbom.cdx.json /src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json

  # End-to-end regression: the whole system on Docker Compose, driven through its public APIs.
  regression:
    name: End-to-end regression and image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f deploy/docker-compose.yml up --build -d
      - run: deploy/regression.sh
      # The built images are scanned too. Any CRITICAL finding that has a fix fails the build;
      # findings without a published fix cannot be acted on and are reported by the next scan.
      - name: Scan the built images
        run: |
          for image in $(docker compose -f deploy/docker-compose.yml config --images | grep '^dws-trade-app'); do
            echo "Scanning $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
