# Proposes updates weekly: libraries, the workflow actions and base-image digests.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /trade-dashboard-ui
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /trade-dashboard-ui
    schedule: { interval: weekly }
